name: Sync main and build patched Dockwatch

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Build and push even when upstream/main has not changed"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "20 5 * * *"
  push:
    branches:
      - telegram-topic-support-main

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write

concurrency:
  group: sync-main-and-build-patched
  cancel-in-progress: false

env:
  CUSTOM_BRANCH: telegram-topic-support-main
  UPSTREAM_REPO: https://github.com/Notifiarr/dockwatch.git
  UPSTREAM_BRANCH: main
  REGISTRY: ghcr.io
  IMAGE_NAME: tenda96/dockwatch-telegram-topic

jobs:
  sync-watch-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CUSTOM_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "${UPSTREAM_REPO}" || true
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Check if upstream already supports Telegram topics
        id: upstream_check
        run: |
          mkdir -p /tmp/upstream-check

          git show "upstream/${UPSTREAM_BRANCH}:root/app/www/public/classes/traits/Notifications/Telegram.php" > /tmp/upstream-check/Telegram.php || true
          git show "upstream/${UPSTREAM_BRANCH}:root/app/www/public/classes/Notifications.php" > /tmp/upstream-check/Notifications.php || true

          HAS_MESSAGE_THREAD_ID="false"
          HAS_MESSAGE_THREAD_PARAM="false"
          HAS_MULTI_PLATFORM_NOTIFY_FIX="false"

          if grep -q "message_thread_id" /tmp/upstream-check/Telegram.php; then
            HAS_MESSAGE_THREAD_ID="true"
          fi

          if grep -q "messageThreadId" /tmp/upstream-check/Telegram.php /tmp/upstream-check/Notifications.php; then
            HAS_MESSAGE_THREAD_PARAM="true"
          fi

          if ! grep -q "return \$this->telegram" /tmp/upstream-check/Notifications.php && ! grep -q "return \$this->mattermost" /tmp/upstream-check/Notifications.php; then
            HAS_MULTI_PLATFORM_NOTIFY_FIX="true"
          fi

          echo "has_message_thread_id=${HAS_MESSAGE_THREAD_ID}" >> "$GITHUB_OUTPUT"
          echo "has_message_thread_param=${HAS_MESSAGE_THREAD_PARAM}" >> "$GITHUB_OUTPUT"
          echo "has_multi_platform_notify_fix=${HAS_MULTI_PLATFORM_NOTIFY_FIX}" >> "$GITHUB_OUTPUT"

      - name: Open issue if upstream may include Telegram topic support
        if: steps.upstream_check.outputs.has_message_thread_id == 'true' || steps.upstream_check.outputs.has_message_thread_param == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "upstream-watch" \
            --repo "${{ github.repository }}" \
            --color "0969DA" \
            --description "Automated upstream monitoring" || true

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "upstream-watch" \
            --search "Telegram topic support upstream" \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$existing" ]; then
            cat > /tmp/upstream-topic-issue.md <<EOF
          The upstream Dockwatch main branch appears to contain Telegram topic/thread support.

          Detected:
          - message_thread_id: ${{ steps.upstream_check.outputs.has_message_thread_id }}
          - messageThreadId parameter: ${{ steps.upstream_check.outputs.has_message_thread_param }}
          - multi-platform notify fix: ${{ steps.upstream_check.outputs.has_multi_platform_notify_fix }}

          Suggested checks:
          1. Compare upstream Telegram.php with our patched Telegram.php.
          2. Compare upstream Notifications.php with our patched Notifications.php.
          3. Check whether upstream added a migration/config field for messageThreadId.
          4. If upstream has everything, remove the local patch and switch back to the official image.
          EOF

            gh issue create \
              --repo "${{ github.repository }}" \
              --label "upstream-watch" \
              --title "Telegram topic support upstream may now be available" \
              --body-file /tmp/upstream-topic-issue.md
          fi

      - name: Merge upstream main into patched branch
        id: merge
        continue-on-error: true
        run: |
          BEFORE_SHA=$(git rev-parse HEAD)
          echo "before_sha=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "No upstream changes to merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "after_sha=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

          AFTER_SHA=$(git rev-parse HEAD)
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "after_sha=${AFTER_SHA}" >> "$GITHUB_OUTPUT"

      - name: Open issue if upstream merge failed
        if: steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge --abort || true

          gh label create "upstream-watch" \
            --repo "${{ github.repository }}" \
            --color "0969DA" \
            --description "Automated upstream monitoring" || true

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "upstream-watch" \
            --search "Manual upstream merge needed" \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$existing" ]; then
            cat > /tmp/merge-failed-issue.md <<EOF
          The scheduled workflow could not automatically merge upstream/main into telegram-topic-support-main.

          This probably means upstream changed one of the patched files.

          Files to check:
          - root/app/www/public/classes/traits/Notifications/Telegram.php
          - root/app/www/public/classes/Notifications.php
          - root/app/www/public/migrations/023_telegram_thread_id.php

          Action needed:
          1. Open the failed workflow run.
          2. Check the merge conflict.
          3. Manually merge upstream changes into telegram-topic-support-main.
          4. Re-run this workflow.
          EOF

            gh issue create \
              --repo "${{ github.repository }}" \
              --label "upstream-watch" \
              --title "Manual upstream merge needed for telegram-topic-support-main" \
              --body-file /tmp/merge-failed-issue.md
          fi

          exit 1

      - name: Push merged upstream changes
        if: steps.merge.outputs.merged == 'true'
        run: |
          git push origin HEAD:${CUSTOM_BRANCH}

      - name: Decide whether to build
        id: build_decision
        run: |
          SHOULD_BUILD="false"

          if [ "${{ github.event_name }}" = "push" ]; then
            SHOULD_BUILD="true"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_rebuild }}" = "true" ]; then
            SHOULD_BUILD="true"
          fi

          if [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
            SHOULD_BUILD="true"
          fi

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker metadata values
        if: steps.build_decision.outputs.should_build == 'true'
        id: version
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:00Z)" >> "$GITHUB_ENV"
          echo "COMMITS=$(git rev-list --count --all || echo 0)" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"
          echo "HEAD_BRANCH=${CUSTOM_BRANCH}" >> "$GITHUB_ENV"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "arm64"

      - name: Setup Docker buildx
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.build_decision.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.CUSTOM_BRANCH }}
            type=raw,value=${{ steps.version.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}

      - name: Build and push patched image
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            "BUILD_DATE=${{ env.BUILD_DATE }}"
            "COMMITS=${{ env.COMMITS }}"
            "BRANCH=${{ env.HEAD_BRANCH }}"
            "COMMIT=${{ env.HEAD_SHA }}"

      - name: Skip build
        if: steps.build_decision.outputs.should_build != 'true'
        run: |
          echo "No upstream changes detected; scheduled build skipped."
